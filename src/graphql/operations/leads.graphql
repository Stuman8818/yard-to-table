query Leads($search: String, $status: LeadStatus, $sort: LeadSort) {
  leads(search: $search, status: $status, sort: $sort) {
    id
    firstName
    lastName
    email
    phone
    status
    createdAt
    requestedServices {
      id
      leadId
      serviceType
    }
  }
}

query LeadDetails($id: ID!) {
  lead(id: $id) {
    id
    firstName
    lastName
    email
    phone
    addressLine1
    addressLine2
    city
    state
    postalCode
    status
    notes
    createdAt
    updatedAt
    requestedServices {
      id
      serviceType
    }
    internalNotes {
      id
      content
      createdAt
      updatedAt
      author {
        name
        email
      }
    }
    convertedCustomer {
      id
    }
    consultations {
      id
      type
      scheduledStart
      scheduledEnd
      status
      assignedUser {
        name
        email
      }
    }
  }
}

mutation ScheduleLeadConsultation($input: ScheduleLeadConsultationInput!) {
  scheduleLeadConsultation(input: $input) {
    id
  }
}

mutation ConvertLeadToCustomer($leadId: ID!) {
  convertLeadToCustomer(leadId: $leadId) {
    id
  }
}

mutation UndoLeadConversion($leadId: ID!) {
  undoLeadConversion(leadId: $leadId) {
    id
    status
    updatedAt
    convertedCustomer {
      id
    }
  }
}

mutation UpdateLeadStatus($leadId: ID!, $status: LeadStatus!) {
  updateLeadStatus(leadId: $leadId, status: $status) {
    id
    status
    updatedAt
  }
}

mutation AddLeadNote($leadId: ID!, $content: String!) {
  addLeadNote(leadId: $leadId, content: $content) {
    id
    content
    createdAt
    updatedAt
    author {
      name
      email
    }
  }
}
